$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  Learnings (data/learnings/<slug>.md): durable memory for the agent and the
  team, one fact per page — a pitfall to avoid, a standing rule, or a mistaken
  belief put right — dated when it was discovered.
maxDepth: 2
maxTokens: 600
frontmatter:
  type: object
  additionalProperties: false
  required: [type, created, kind]
  properties:
    type: { const: learning }
    created:
      type: string
      format: date
      description: created is the YYYY-MM-DD date the fact was discovered or stated, which may precede the day it was recorded
    kind:
      enum: [trap, rule, correction]
      description: "kind must be one of: trap, rule, correction"
    session:
      type: string
      minLength: 1
      description: session is the identifier of the agent session that produced the fact, if available
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and data/index.md show
    resource:
      type: string
      description: canonical URI of the underlying asset this document describes (SPEC §4.1)
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4) — this type has no stage to derive it from, so leave it unset; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a repo path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
sections:
  - header: { minLength: 1 }
    maxContains: 1
    description: a single heading states the fact, and the prose beneath explains it
additionalSections: false
