name: Codebase
columns: [commit]
fields:
  source:
    description: Repository path of the code this document describes; the first entry is primary.
  commit:
    description: Git commit the code was read at. Changes to source after it mean the doc may be stale.
  type:
    hidden: true
  description:
    description: One sentence summarizing the document, shown by the hubs and data/index.md.
    multiline: true
  status:
    title: OKF status
    description: OKF lifecycle, derived from stage. Absent means stable.
    values:
      draft:
        title: Draft
        color: gray
      stable:
        title: Stable
        color: green
      deprecated:
        title: Deprecated
        color: red
  stale_after:
    title: Stale after
    description: The day this content should be checked again.
  generated:
    hidden: true
  verified:
    title: Verified
    description: Who last confirmed this document against the code, and when.
  sources:
    hidden: true
  usage_window:
    hidden: true
  resource:
    hidden: true
