$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  Bug tickets, one per problem (data/bugs/<slug>.md), describing what was
  observed rather than what is suspected: a "# Bug: <short symptom>" title
  holding "## Symptom", "## Expected" and "## Reproduction", followed by optional
  investigation and fix sections. created, reported_by and affected_versions
  are required. An open bug has no stage; a done bug records completed.
maxDepth: 4
frontmatter:
  type: object
  additionalProperties: false
  required: [type, created, reported_by, affected_versions]
  properties:
    type: { const: bug }
    stage:
      enum: [deferred, done, cancelled]
      description: "stage, if present, must be one of: deferred, done, cancelled (omit while open)"
    reported_by:
      enum: [user, agent]
      description: >-
        reported_by names who noticed the problem, not who typed the ticket:
        user for a person, agent for an agent that spotted it unprompted during
        a review, a test run or unrelated work
    created:
      type: string
      format: date
      description: created is the YYYY-MM-DD date the ticket was filed
    completed:
      type: string
      format: date
      description: completed is the YYYY-MM-DD date the bug was fixed
    affected_versions:
      type: array
      minItems: 1
      items:
        type: string
        pattern: '^(unreleased|\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$'
      description: >-
        affected_versions holds the versions the bug has been observed in, in
        release order; each is a semantic version like 0.1.0 or 1.0.0-beta.1, the
        same form a release page's version takes, or unreleased
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and data/index.md show
    resource:
      type: string
      description: canonical URI of the underlying asset this document describes (SPEC §4.1)
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4), derived from stage — set it only for the draft and deprecated cases in SCHEMA.md; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a repo path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
  if:
    required: [stage]
    properties:
      stage: { const: done }
  then:
    required: [completed]
    description: a bug marked done must carry a completed date
sections:
  - header: { pattern: '^Bug: .+' }
    maxContains: 1
    description: 'a single "# Bug: <short symptom>" heading holds every section'
    sections:
      - header: { const: Symptom }
        maxContains: 1
        description: the observed behaviour, the date, and the version it was seen on
      - header: { const: Expected }
        maxContains: 1
        description: the correct behaviour, citing the spec or feature document that defines it
      - header: { const: Reproduction }
        maxContains: 1
        description: numbered steps that trigger the bug; when none are known yet, a sentence saying so
      - header: { const: Leads }
        minContains: 0
        maxContains: 1
      - header: { const: Root cause }
        minContains: 0
        maxContains: 1
      - header: { const: Fix }
        minContains: 0
        maxContains: 1
      - header: { const: Recurrence }
        minContains: 0
        maxContains: 1
      - header: { const: Related }
        minContains: 0
        maxContains: 1
      - header: { const: Key references }
        minContains: 0
        maxContains: 1
    additionalSections: false
additionalSections: false
