name: Releases
columns: [stage, date]
fields:
  version:
    description: The version number, like 1.4.2, or unreleased on the collecting page.
  stage:
    title: Stage
    description: Out to users, or still collecting work.
    values:
      released:
        title: Released
        color: green
      unreleased:
        title: Unreleased
        color: blue
  date:
    description: The day it went out (YYYY-MM-DD).
  type:
    hidden: true
  description:
    description: One sentence summarizing the document, shown by the hubs and data/index.md.
    multiline: true
  status:
    title: Status
    description: OKF lifecycle, derived from stage. Absent means stable.
    values:
      draft:
        title: Draft
        color: gray
      stable:
        title: Stable
        color: green
      deprecated:
        title: Deprecated
        color: red
  stale_after:
    title: Stale after
    description: The day this content should be checked again.
  generated:
    hidden: true
  verified:
    hidden: true
  sources:
    hidden: true
  usage_window:
    hidden: true
  resource:
    hidden: true
