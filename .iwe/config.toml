version = 4

[markdown]
refs_extension = ".md"
date_format = "%b %d, %Y"

[markdown.formatting]
wrap_column = 80

[workspace]
path = ""
date_format = "%Y-%m-%d"

[search]
language = "english"

[completion]

[templates.default]
key_template = "{{slug}}"
document_template = """
# {{title}}

{{content}}"""

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.link]
type = "link"
title = "Link"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.sort]
type = "sort"
title = "Sort A-Z"
reverse = false

# Document-schema bindings. Each entry names a schema file in .iwe/schemas/<name>.yaml
# and a key-glob that binds it. Bindings are BY PATH, not by frontmatter fields.
# A folder glob (data/plans/**) binds the documents in the folder; the hub beside
# it (data/plans) matches no folder glob and is bound by name under [schemas.hub]
# below, so every document under data/ is validated.
# Run: iwe schema validate  (--explain shows the binding trace).

[schemas.plan]
match = "data/plans/**"

[schemas.feature]
match = "data/features/**"

[schemas.bug]
match = "data/bugs/**"

[schemas.release]
match = "data/releases/**"

[schemas.task]
match = "data/backlog/**"

[schemas.spec]
match = "data/spec/**"

[schemas.architecture]
match = "data/architecture/**"

[schemas.concept]
match = "data/concept/**"

[schemas.someday]
match = "data/someday/**"

[schemas.learning]
match = "data/learnings/**"

# Directory hubs. OKF conformance requires every non-reserved document under the
# bundle to carry a type, so the hubs are typed and validated too. A new hub is
# added to this list.
[schemas.hub]
match = [
  "data/architecture",
  "data/backlog",
  "data/bugs",
  "data/bugs-archive",
  "data/concept",
  "data/features",
  "data/learnings",
  "data/plans",
  "data/plans-archive",
  "data/releases",
  "data/someday",
  "data/spec",
]

[schemas.tracker]
match = ["data/product", "data/milestone"]

# OKF v0.2 conformance (SPEC §11). Every document under data/ is bound to exactly
# one typed schema above, and each requires a type; okf-index and okf-log check
# the body shapes of the reserved files, which a frontmatter-only check cannot
# see. A new folder under data/ needs a binding of its own.
[schemas.okf-index]
match = ["data/index", "data/**/index"]

[schemas.okf-log]
match = ["data/log", "data/**/log"]
