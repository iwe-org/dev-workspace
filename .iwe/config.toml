version = 3

[markdown]
refs_extension = ".md"
date_format = "%b %d, %Y"

[markdown.formatting]
wrap_column = 80

[library]
path = ""
date_format = "%Y-%m-%d"
frontmatter_document_title = "title"

[search]
language = "english"

[completion]

[templates.default]
key_template = "{{slug}}"
document_template = """
# {{title}}

{{content}}"""

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.link]
type = "link"
title = "Link"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.sort]
type = "sort"
title = "Sort A-Z"
reverse = false

# Document-schema bindings. Each entry names a schema file in .iwe/schemas/<name>.yaml
# and a key-glob that binds it. Bindings are BY PATH, not by frontmatter fields.
# The extension-less hub keys (data/plans, data/bugs, ...) match none of these
# globs, so hub documents stay unvalidated by design.
# Run: iwe schema validate  (--explain shows the binding trace).

[schemas.plan]
match = "data/plans/**"

[schemas.feature]
match = "data/features/**"

[schemas.bug]
match = "data/bugs/**"

[schemas.release]
match = "data/releases/**"

[schemas.task]
match = "data/backlog/**"

[schemas.codebase]
match = "data/codebase/**"

[schemas.spec]
match = "data/spec/**"

[schemas.architecture]
match = "data/architecture/**"

[schemas.concept]
match = "data/concept/**"

[schemas.someday]
match = "data/someday/**"

# Directory hubs. OKF conformance requires every non-reserved document under the
# bundle to carry a type, so the hubs are typed and validated too — the earlier
# "hubs stay unvalidated by design" exemption is deliberately retired.
[schemas.hub]
match = [
  "data/architecture",
  "data/backlog",
  "data/bugs",
  "data/codebase",
  "data/concept",
  "data/features",
  "data/plans",
  "data/releases",
  "data/someday",
  "data/spec",
]

[schemas.tracker]
match = ["data/product", "data/milestone"]

# OKF v0.2 conformance (SPEC §11). okf stacks on top of the per-type schemas and
# catches any document arriving without a type; okf-index and okf-log check the
# body shapes of the reserved files, which a frontmatter-only check cannot see.
# The bundle root is data/, so these bind under data/ only.
[schemas.okf]
match = "data/**"
exclude = ["data/index", "data/**/index", "data/log", "data/**/log"]

[schemas.okf-index]
match = ["data/index", "data/**/index"]

[schemas.okf-log]
match = ["data/log", "data/**/log"]
